<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Помощник - Zaman Bank</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="base.css">
  <link rel="stylesheet" href="layout.css">
  <link rel="stylesheet" href="components.css">
  <link rel="stylesheet" href="animations.css">
  <link rel="stylesheet" href="project.css">

  <style>
    .chat-container {
      max-width: 900px;
      margin: 2rem auto;
      height: calc(100vh - 200px);
      display: flex;
      flex-direction: column;
      background: var(--white);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow-xl);
      overflow: hidden;
    }

    .chat-header {
      padding: var(--space-lg);
      background: linear-gradient(135deg, var(--primary) 0%, var(--zaman-green) 100%);
      color: var(--white);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .chat-messages {
      flex: 1;
      padding: var(--space-xl);
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: var(--space-md);
    }

    .message {
      max-width: 70%;
      padding: var(--space-md) var(--space-lg);
      border-radius: var(--radius-lg);
      animation: slideUp 0.3s ease-out;
    }

    .message-user {
      align-self: flex-end;
      background-color: var(--primary);
      color: var(--white);
      border-bottom-right-radius: var(--radius-sm);
    }

    .message-assistant {
      align-self: flex-start;
      background-color: var(--surface);
      color: var(--text-primary);
      border-bottom-left-radius: var(--radius-sm);
    }

    .message-time {
      font-size: var(--text-xs);
      opacity: 0.7;
      margin-top: var(--space-xs);
    }

    .chat-input-area {
      padding: var(--space-lg);
      border-top: 1px solid var(--border);
      display: flex;
      gap: var(--space-md);
      align-items: flex-end;
    }

    .chat-input {
      flex: 1;
      min-height: 50px;
      max-height: 150px;
      resize: none;
    }

    .mic-button {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background-color: var(--primary);
      color: var(--white);
      font-size: 1.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all var(--transition-base);
    }

    .mic-button:hover {
      transform: scale(1.05);
    }

    .mic-button.listening {
      background-color: var(--error);
    }

    .voice-toggle {
      display: flex;
      align-items: center;
      gap: var(--space-sm);
      color: var(--white);
    }
  </style>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
</head>
<body>
  <header class="site-header">
    <div class="container">
      <nav class="navbar">
        <a href="index.html" class="navbar-brand"><span class="brand-mark">Z</span> zaman<span class="brand-dot">.</span></a>
        <ul class="navbar-nav">
          <li><a href="index.html" class="nav-link">Главная</a></li>
          <li><a href="about.html" class="nav-link">О нас</a></li>
          <li><a href="services.html" class="nav-link">Возможности</a></li>
          <li><a href="islamic_finance.html" class="nav-link">Исламские финансы</a></li>
          <li><a href="ai_assistant.html" class="nav-link active">Помощник</a></li>
          <li><a href="contacts.html" class="nav-link">Контакты</a></li>
          <li data-auth-required style="display: none;"><a href="dashboard.html" class="btn btn-primary btn-sm">Личный кабинет</a></li>
        </ul>
        <button class="nav-toggle">☰</button>
      </nav>
    </div>
  </header>

  <div class="container">
    <p class="demo-note" style="margin-top:1.5rem">Это демонстрационный помощник с заранее подготовленными ответами, без реального AI и доступа к банковскому счёту.</p>
    <div class="chat-container">
      <div class="chat-header">
        <div>
          <h2 style="margin: 0; color: var(--white);">Демо помощник</h2>
          <p style="margin: 0; opacity: 0.9; font-size: var(--text-sm);">Спросите о балансе или финансовых целях</p>
        </div>

        <div class="voice-toggle">
          <label style="cursor: pointer;">
            <input type="checkbox" id="voice-toggle"> 🔊 Голос
          </label>
        </div>
      </div>

      <div class="chat-messages" id="chat-messages">
        <!-- Messages will be added here dynamically -->
      </div>

      <div class="chat-suggestions" aria-label="Примеры вопросов">
        <button type="button" data-question="Какой баланс?">Какой баланс?</button>
        <button type="button" data-question="Помоги с целями">Помоги с целями</button>
        <button type="button" data-question="Создай новую цель">Как создать цель?</button>
      </div>

      <div class="chat-input-area">
        <textarea 
          id="message-input" 
          class="form-input chat-input" 
          placeholder="Введите сообщение или используйте микрофон..."
          rows="1"
        ></textarea>

        <button id="mic-button" class="mic-button" title="Голосовой ввод">
          🎤
        </button>

        <button id="send-button" class="btn btn-primary" style="height: 50px;">
          Отправить
        </button>
      </div>
    </div>
  </div>

  <script type="module">
    import * as aiChat from './ai_chat.js';
    import * as auth from './auth.js';
    import * as ui from './ui.js';

    document.addEventListener('DOMContentLoaded', () => {
      auth.init();
      ui.init();
      aiChat.init();
    });
  </script> 
</body>
</html>
