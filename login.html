<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вход - Zaman Bank</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="base.css">
  <link rel="stylesheet" href="layout.css">
  <link rel="stylesheet" href="components.css">
  <link rel="stylesheet" href="animations.css">
  <link rel="stylesheet" href="project.css"><link rel="stylesheet" href="language.css">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<script src="i18n.js" defer></script></head>
<body>
  <div class="flex-center" style="min-height: 100vh; background: linear-gradient(135deg, var(--zaman-green) 0%, var(--primary) 100%); padding: 2rem;">
    <div class="card scale-in" style="max-width: 450px; width: 100%;">
      <div style="text-align: center; margin-bottom: 2rem;">
        <h1 style="color: var(--primary); margin-bottom: 0.5rem;">zaman<span class="brand-dot">.</span></h1>
        <h2 style="font-size: var(--text-2xl);">Вход в демо</h2>
        <p class="demo-note">Это прототип без серверной авторизации. Используйте вымышленные email и пароль от 6 символов. Настоящие пароли не вводите.</p>
      </div>

      <form id="login-form">
        <div class="form-group">
          <label class="form-label" for="email">Email</label>
          <input 
            type="email" 
            id="email" 
            name="email" 
            class="form-input" 
            placeholder="your@email.com"
            required
          >
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Пароль</label>
          <input 
            type="password" 
            id="password" 
            name="password" 
            class="form-input" 
            placeholder="••••••••"
            minlength="6"
            required
          >
        </div>

        <div class="form-group">
          <button type="submit" class="btn btn-primary" style="width: 100%;">
            Войти
          </button>
        </div>

        <div style="text-align: center; margin-top: 1rem;">
          <p style="color: var(--text-secondary);">
            Нет аккаунта? <a href="register.html" style="color: var(--primary); font-weight: 600;">Зарегистрироваться</a>
          </p>
        </div>

        <div style="text-align: center; margin-top: 1rem;">
          <a href="index.html" class="btn btn-ghost">← Вернуться на главную</a>
        </div>
      </form>
    </div>
  </div>

  <script type="module">
    import * as auth from './auth.js';
    import * as validator from './validator.js';

    document.addEventListener('DOMContentLoaded', () => {
      const form = document.getElementById('login-form');
      form.addEventListener('submit', auth.handleLogin);

      // Real-time validation
      const emailInput = form.elements.email;
      const passwordInput = form.elements.password;

      emailInput.addEventListener('blur', () => {
        const result = validator.validateEmail(emailInput.value);
        if (!result.ok) {
          validator.showError(emailInput, result.message);
        } else {
          validator.clearError(emailInput);
        }
      });

      passwordInput.addEventListener('blur', () => {
        const result = validator.validatePassword(passwordInput.value);
        if (!result.ok) {
          validator.showError(passwordInput, result.message);
        } else {
          validator.clearError(passwordInput);
        }
      });
    });
  </script>
</body>
</html>
