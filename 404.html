<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Страница не найдена</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="base.css">
  <link rel="stylesheet" href="layout.css">
  <link rel="stylesheet" href="components.css">
  <link rel="stylesheet" href="animations.css">
  <link rel="stylesheet" href="project.css"><link rel="stylesheet" href="language.css">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<script src="i18n.js" defer></script></head>
<body>
  <div class="flex-center" style="min-height: 100vh; background: linear-gradient(135deg, var(--zaman-green) 0%, var(--primary) 100%); padding: 2rem;">
    <div class="card scale-in" style="text-align: center; max-width: 500px;">
      <div style="font-size: 8rem; margin-bottom: 1rem;">😕</div>
      <h1 style="font-size: var(--text-5xl); color: var(--primary); margin-bottom: 1rem;">404</h1>
      <h2 style="margin-bottom: 1rem;">Страница не найдена</h2>
      <p style="color: var(--text-secondary); margin-bottom: 2rem;">
        К сожалению, запрашиваемая страница не существует или была перемещена.
      </p>

      <div class="flex-center gap-md" style="flex-wrap: wrap;">
        <a href="index.html" class="btn btn-primary">На главную</a>
        <button type="button" onclick="history.back()" class="btn btn-outline">Назад</button>
      </div>
    </div>
  </div>

  <script type="module">
    import * as animations from './animations.js';

    document.addEventListener('DOMContentLoaded', () => {
      animations.initPageTransition();
    });
  </script>
</body>
</html>
